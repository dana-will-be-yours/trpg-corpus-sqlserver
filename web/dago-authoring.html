<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DaGo 劇情編寫介面</title><style>body{margin:0;background:#111;color:#eee;font-family:Verdana,Arial,'Microsoft JhengHei',sans-serif;line-height:1.55}.wrap{display:grid;grid-template-columns:18rem 1fr;min-height:100vh}aside{background:#222;border-right:1px solid #555;padding:1rem}main{padding:1rem;max-width:80rem}h1,h2{color:#ffd700}button,input,textarea,select{font:inherit;background:#333;color:#eee;border:1px solid #555;padding:.45rem}button{cursor:pointer}label{display:grid;gap:.2rem;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.7rem}.card,.item{border:1px solid #555;background:#222;padding:.7rem;margin:.4rem 0}textarea{width:100%;min-height:7rem}.wide{grid-column:1/-1}pre{white-space:pre-wrap;background:#050505;border:1px solid #444;padding:.8rem;max-height:30rem;overflow:auto}.muted{color:#bbb}</style></head><body><div class="wrap"><aside><h1>DaGo 編寫</h1><p class="muted">研究者編寫地點、NPC、場景、選項與檢定，再匯出 JSON 匯入 SQL Server。</p><button data-panel="meta">專案</button><button data-panel="passages">場景</button><button data-panel="choices">選項</button><button data-panel="export">匯出 JSON</button><hr><button id="loadExample">載入範例</button><button id="saveLocal">本機保存</button><button id="loadLocal">讀取保存</button></aside><main><section id="metaPanel"><h2>專案設定</h2><div class="grid"><label>story_code<input id="storyCode" value="DAGUO_DC20_OPENING"></label><label>project_code<input id="projectCode" value="DAGUO"></label><label>team_code<input id="teamCode" value="DAGUO-T01"></label><label>session_code<input id="sessionCode" value="DA20-PLAYABLE-001"></label></div></section><section id="passagesPanel" hidden><h2>場景</h2><button id="addPassage">新增場景</button><div id="passageList"></div><div class="card"><h3>場景編輯</h3><div class="grid"><label>passage_code<input id="pCode"></label><label>title<input id="pTitle"></label><label>location<input id="pLocation"></label><label>time_slot<input id="pTime"></label><label>sort_order<input id="pSort" type="number" value="100"></label><label>is_start<select id="pStart"><option value="false">false</option><option value="true">true</option></select></label><label class="wide">body<textarea id="pBody"></textarea></label><label class="wide">tags，一行一個<textarea id="pTags"></textarea></label></div><button id="savePassage">保存場景</button></div></section><section id="choicesPanel" hidden><h2>選項</h2><div class="grid"><label>所屬場景<select id="choicePassage"></select></label><label>choice_code<input id="cCode"></label><label>text<input id="cText"></label><label>target<select id="cTarget"></select></label><label>function<select id="cFunc"><option>action</option><option>question</option><option>decision</option><option>negotiation</option><option>summary</option></select></label><label>skill<select id="cSkill"><option value="">無</option><option value="office">政務</option><option value="jianghu">江湖</option><option value="observe">觀察</option><option value="listen">聆聽</option><option value="speech">口才</option><option value="social">交際</option><option value="empathy">共情</option><option value="geo">地理</option><option value="nature">自然</option><option value="medicine">醫術</option><option value="study">學藝</option><option value="hide">躲藏</option><option value="light">輕功</option><option value="outer">外功</option></select></label><label>DC<select id="cDc"><option value="0">無</option><option value="8">8 簡單</option><option value="10">10 基礎挑戰</option><option value="12">12 標準挑戰</option><option value="14">14 困難</option><option value="16">16 很困難</option><option value="18">18 極難</option><option value="20">20 傳奇級</option></select></label><label>need<input id="cNeed"></label><label>gain<input id="cGain"></label><label class="wide">success text<textarea id="cSuccess"></textarea></label><label class="wide">failure text<textarea id="cFailure"></textarea></label></div><button id="saveChoice">保存選項</button><div id="choiceList"></div></section><section id="exportPanel" hidden><h2>匯出 JSON</h2><button id="buildJson">產生 JSON</button><button id="copyJson">複製</button><button id="downloadJson">下載</button><pre id="jsonOut"></pre></section></main></div><script>const store='dagoAuthoringDraft';const state={meta:{story_code:'DAGUO_DC20_OPENING',project_code:'DAGUO',team_code:'DAGUO-T01',session_code:'DA20-PLAYABLE-001'},passages:[],current:null};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>show(b.dataset.panel));function show(n){['meta','passages','choices','export'].forEach(x=>$(x+'Panel').hidden=x!==n);if(n==='passages')renderPassages();if(n==='choices')renderChoices();if(n==='export')buildJson()}function syncMeta(){state.meta={story_code:$('storyCode').value.trim(),project_code:$('projectCode').value.trim(),team_code:$('teamCode').value.trim(),session_code:$('sessionCode').value.trim()}}function readTags(v){return String(v||'').split(/\n+/).map(x=>x.trim()).filter(Boolean)}function uid(p){return p+'_'+Math.random().toString(36).slice(2,8)}$('addPassage').onclick=()=>{let code=uid('P');state.passages.push({passage_code:code,title:'新場景',location:'',time_slot:'',body:'',tags:['researcher'],is_start:state.passages.length===0,sort_order:(state.passages.length+1)*100,choices:[]});editPassage(code)};$('savePassage').onclick=()=>{let p=state.passages.find(x=>x.passage_code===state.current)||state.passages[0];if(!p)return;p.passage_code=$('pCode').value.trim();p.title=$('pTitle').value.trim();p.location=$('pLocation').value.trim();p.time_slot=$('pTime').value.trim();p.sort_order=+$('pSort').value||100;p.is_start=$('pStart').value==='true';p.body=$('pBody').value;p.tags=readTags($('pTags').value);state.current=p.passage_code;renderPassages();renderChoices()};function editPassage(code){let p=state.passages.find(x=>x.passage_code===code);if(!p)return;state.current=code;$('pCode').value=p.passage_code;$('pTitle').value=p.title;$('pLocation').value=p.location||'';$('pTime').value=p.time_slot||'';$('pSort').value=p.sort_order||100;$('pStart').value=String(!!p.is_start);$('pBody').value=p.body||'';$('pTags').value=(p.tags||[]).join('\n')}function renderPassages(){let list=$('passageList');list.innerHTML=state.passages.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(p=>'<div class="item"><b>'+esc(p.title)+'</b><br><small>'+esc(p.passage_code)+' / '+esc(p.location||'')+'</small><br><button data-edit="'+esc(p.passage_code)+'">編輯</button></div>').join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPassage(b.dataset.edit))}function optionHtml(){return state.passages.map(p=>'<option value="'+esc(p.passage_code)+'">'+esc(p.title)+' ('+esc(p.passage_code)+')</option>').join('')}function renderChoices(){let opts=optionHtml();$('choicePassage').innerHTML=opts;$('cTarget').innerHTML='<option value="">無</option>'+opts;if(state.current)$('choicePassage').value=state.current;renderChoiceList()}$('choicePassage').onchange=renderChoiceList;$('saveChoice').onclick=()=>{let p=state.passages.find(x=>x.passage_code===$('choicePassage').value);if(!p)return;let c={id:$('cCode').value.trim()||uid('C'),text:$('cText').value.trim(),target:$('cTarget').value||null,utterance_function:$('cFunc').value,check:$('cSkill').value?{skill:$('cSkill').value,dc:+$('cDc').value||8}:null,conditions:$('cNeed').value.trim()?[{op:'has',path:'flags',value:$('cNeed').value.trim()}]:[],effects:$('cGain').value.trim()?[{op:'gain',value:$('cGain').value.trim()}]:[],success_text:$('cSuccess').value.trim(),failure_text:$('cFailure').value.trim(),sort_order:(p.choices.length+1)*100};p.choices.push(c);['cCode','cText','cNeed','cGain','cSuccess','cFailure'].forEach(id=>$(id).value='');renderChoiceList()};function renderChoiceList(){let p=state.passages.find(x=>x.passage_code===$('choicePassage').value);$('choiceList').innerHTML=p?(p.choices||[]).map(c=>'<div class="item"><b>'+esc(c.text)+'</b><br><small>'+esc(c.id)+' → '+esc(c.target||'')+'</small></div>').join(''):''}function buildJson(){syncMeta();let txt=JSON.stringify({metadata:state.meta,passages:state.passages},null,2);$('jsonOut').textContent=txt;return txt}$('buildJson').onclick=buildJson;$('copyJson').onclick=()=>navigator.clipboard?.writeText(buildJson());$('downloadJson').onclick=()=>{let b=new Blob([buildJson()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(state.meta.story_code||'dago_story')+'.json';a.click();URL.revokeObjectURL(u)};$('saveLocal').onclick=()=>{syncMeta();localStorage.setItem(store,JSON.stringify(state))};$('loadLocal').onclick=()=>{let raw=localStorage.getItem(store);if(raw)Object.assign(state,JSON.parse(raw));fillMeta();renderPassages();renderChoices()};$('loadExample').onclick=()=>{state.meta={story_code:'DAGUO_DC20_OPENING',project_code:'DAGUO',team_code:'DAGUO-T01',session_code:'DA20-PLAYABLE-001'};state.passages=[{passage_code:'NANJING_GATE',title:'南京外城',location:'南京',time_slot:'卯時',body:'城門外的雨痕尚未乾，驛馬從石道上踏過。近幾日，中南部銀錢流向異常。',tags:['南京','開局'],is_start:true,sort_order:100,choices:[{id:'TO_TEA',text:'去茶棚聽南來商旅說話',target:'TEA_STALL',utterance_function:'question',check:{skill:'listen',dc:8},conditions:[],effects:[],sort_order:100}]},{passage_code:'TEA_STALL',title:'城門茶棚',location:'南京茶棚',time_slot:'辰時',body:'茶博士收起抹布。旁桌兩名商旅說起江郡北虎商會、南陽商銀與江夏糧船。',tags:['茶棚','情報'],is_start:false,sort_order:200,choices:[]}];fillMeta();renderPassages();renderChoices();show('passages')};function fillMeta(){$('storyCode').value=state.meta.story_code;$('projectCode').value=state.meta.project_code;$('teamCode').value=state.meta.team_code;$('sessionCode').value=state.meta.session_code}fillMeta();show('meta');</script></body></html>
