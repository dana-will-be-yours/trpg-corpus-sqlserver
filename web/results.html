<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成果視覺化 | TRPG 共創研究</title>
  <meta name="description" content="TRPG 共創研究成果視覺化，呈現可行性、交叉設計、SMM、TMS、設定回查、故事評分、信度與質性資料。">
  <link rel="stylesheet" href="assets/research-ui.css">
</head>
<body class="research-tools portal-page results-page">
  <a class="skip-link" href="#main-content">跳到主內容</a>
  <header class="site-header">
    <a class="brand" href="../index.html">
      <strong>TRPG 共創研究</strong>
      <span>成果視覺化</span>
    </a>
    <nav class="site-nav" aria-label="主要頁面">
      <a href="../index.html">首頁</a>
      <a href="data-collection.html">資料蒐集</a>
      <a href="gm-prep.html">GM 資訊</a>
      <a href="results.html" aria-current="page">成果視覺化</a>
      <a href="transcript-review.html">逐字稿審閱</a>
    </nav>
  </header>

  <main id="main-content" class="portal-main" tabindex="-1">
    <section class="module-hero results-hero">
      <div>
        <p class="kicker">分析集合 FAS／PPS／MAS</p>
        <h1>成果視覺化</h1>
        <p>查看可行性、期間與序列、團隊內 A／B 配對、SMM、TMS、設定回查、故事評分、ICC 與質性資料。</p>
      </div>
    </section>

    <section class="viz-catalogue" aria-labelledby="catalogue-title">
      <div class="section-heading">
        <h2 id="catalogue-title">成果圖表</h2>
      </div>

      <figure class="viz-card">
        <div class="viz-empty viz-flow" role="img" aria-label="參與流程圖"></div>
        <figcaption><strong>參與流程圖</strong><span>招募、納入、分派、兩期完成與分析集合人數</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-interval" role="img" aria-label="可行性比例區間圖"></div>
        <figcaption><strong>比例與區間點圖</strong><span>招募率、保留率、兩期完成率、資料完整率</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-paired" role="img" aria-label="團隊內配對軌跡圖"></div>
        <figcaption><strong>團隊內配對軌跡圖</strong><span>每隊 A 與 B 的原始值、方向與差值</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-sequence" role="img" aria-label="序列期間圖"></div>
        <figcaption><strong>序列 × 期間分面圖</strong><span>監看期別、序列、題本與工具學習延續</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-scatter" role="img" aria-label="SMM 散點圖"></div>
        <figcaption><strong>設定知識二維散點圖</strong><span>知識相似度與知識正確性分開計算後聯合顯示</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-profile" role="img" aria-label="TMS 構面圖"></div>
        <figcaption><strong>TMS 構面點線圖</strong><span>專長分化、知識可信度與協調的期前期後變化</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-query" role="img" aria-label="設定回查組合圖"></div>
        <figcaption><strong>設定回查三聯圖</strong><span>正確率、來源配對與查找時間分面呈現</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-rating" role="img" aria-label="故事評分分布圖"></div>
        <figcaption><strong>故事評分分布與配對差圖</strong><span>六構面的專家原始分數、條件分布與團隊差值</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-forest" role="img" aria-label="ICC 區間圖"></div>
        <figcaption><strong>ICC 區間森林圖</strong><span>各構面的 ICC(2,1)、ICC(2,3) 與 95% 信賴區間</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-matrix" role="img" aria-label="缺漏矩陣"></div>
        <figcaption><strong>缺漏與偏離矩陣</strong><span>依團隊、期別、資料階段與原因顯示完整性</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-theme" role="img" aria-label="質性主題矩陣"></div>
        <figcaption><strong>質性主題矩陣</strong><span>PL 與 GM 對資料取回、分工、負荷及跨期延續的主題分布</span></figcaption>
      </figure>
      <figure class="viz-card">
        <div class="viz-empty viz-table" role="img" aria-label="研究結果表"></div>
        <figcaption><strong>估計值結果表</strong><span>樣本數、A／B 摘要、配對差、不確定區間、缺漏與分析集合</span></figcaption>
      </figure>
    </section>

    <section class="next-panel" aria-label="回到資料蒐集">
      <div><h2>查看量測時序與題組配置</h2></div>
      <a class="button primary" href="data-collection.html">查看資料蒐集設計</a>
    </section>
  </main>
</body>
</html>
